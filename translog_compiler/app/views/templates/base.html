<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Validador de Guías de Remisión{% endblock %} · TransLog Perú</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
  <header class="barra">
    <div class="contenedor barra-in">
      <strong>TransLog Perú · Minicompilador de guías</strong>
      <nav>
        <a href="{{ url_for('main.index') }}">Validar</a>
        <a href="{{ url_for('main.historial') }}">Historial</a>
        <a href="{{ url_for('main.gramatica') }}">Gramática y AFD</a>
      </nav>
    </div>
  </header>
  <main class="contenedor">{% block contenido %}{% endblock %}</main>
  <footer class="contenedor pie">Teoría de Computación · USIL · Análisis léxico-sintáctico con AFD y GLC</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
